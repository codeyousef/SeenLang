manifest-version = 1

[project]
name = "test_project"
version = "0.1.0"
language = "en"
edition = "2024"

[format]
line-width = 72
indent = 3
trailing-comma = false
sort-imports = false
authors = ["Test Author <test@seen-lang.org>"]
description = "Test project for VSCode extension testing"

[dependencies]

[dev-dependencies]

[build]
target = "native"
optimization = "debug"

[reactive]
enabled = true
marble_diagrams = true

[benchmarks]
enabled = true
iterations = 1000
