manifest-version = 1

[project]
name = "seen_vulkan_min"
version = "0.1.0"
language = "en"
description = "Deterministic Vulkan-style triangle sample for the Seen MVP."

[build]
entry = "src/main.seen"
targets = ["linux-x86_64", "android-arm64"]
optimize = "speed"

[assets]
shaders = ["shaders/triangle.spv"]
