manifest-version = 1

[project]
name = "seen_qwen_foundation"
version = "0.19.2"
language = "en"
visibility = "private"
edition = "2025"
modules = [
    "src/artifact_store.seen",
    "src/config.seen",
    "src/model_lock.seen",
    "src/tensor_catalog.seen",
    "src/tokenizer_assets.seen"
]

[dependencies]
seen_std = { path = "../../../seen_std" }

[build]
targets = ["native"]
optimize = "speed"
profile = "release"
