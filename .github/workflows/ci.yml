{name: Finite-address SDK admission discriminator,"on": {workflow_dispatch: {}},permissions: {contents: read,actions: read},concurrency: {group: m0-tsan-finite-sdk-discriminator,cancel-in-progress: false},jobs: {native-diagnostic: {runs-on: ubuntu-24.04,timeout-minutes: 20,env: {GOTOOLCHAIN: local,SEEN_RELEASE_CPU_BASELINE: x86-64},steps: [{name: Checkout original observed source without modification,uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683,with: {ref: 727dd02f048ef93d90f4ad79e339098eccdf46c2}},{name: Set up pinned Go,uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e,with: {go-version: 1.26.5,cache: false}},{name: Derive finite limits from live memory,run: "python3 - <<'PY'\nimport os\nfrom pathlib import Path\nmemory = dict((line.split(':',1)[0],int(line.split()[1])*1024) for line in Path('/proc/meminfo').read_text().splitlines() if line.startswith(('MemTotal:','MemAvailable:')))\ntotal,available=memory['MemTotal'],memory['MemAvailable']\ncgroup_root=Path('/sys/fs/cgroup')\nfor line in Path('/proc/self/cgroup').read_text().splitlines():\n if line.startswith('0::'):\n  group=cgroup_root/line.split(':',2)[2].lstrip('/')\n  while group==cgroup_root or cgroup_root in group.parents:\n   limit_file=group/'memory.max'\n   if limit_file.is_file():\n    limit=limit_file.read_text().strip()\n    if limit.isdecimal():\n     total=min(total,int(limit));available=min(available,max(0,int(limit)-int((group/'memory.current').read_text())))\n   if group==cgroup_root:break\n   group=group.parent\nreserve=max(512*1024**2,total//10)\ncap=min(2*1024**3,total*3//5,available-reserve)//1024\nif cap<512*1024:raise SystemExit('Insufficient live memory for bounded diagnostic')\nopt=min(2*1024**2,cap//2,total//10240)\nvalues={'SEEN_LOW_MEMORY':1,'SEEN_JOBS':1,'SEEN_OPT_JOBS':1,'SEEN_MAIN_VMEM_KB':cap,'SEEN_OPT_VMEM_KB':opt,'SEEN_MEMORY_LIMIT_BYTES':cap*1024,'SEEN_GUARD_RSS_KB':cap,'SEEN_GUARD_RESERVE_KB':reserve//1024,'SEEN_GUARD_TASKS_MAX':24,'SEEN_MEMORY_GUARD_RSS_KB':cap,'SEEN_MEMORY_GUARD_CGROUP_STOP_KB':cap,'SEEN_MEMORY_GUARD_RESERVE_KB':reserve//1024,'SEEN_MEMORY_GUARD_TASKS_MAX':24}\nwith open(os.environ['GITHUB_ENV'],'a') as output:\n for key,value in values.items():output.write(f'{key}={value}\\n')\nprint('Live-derived diagnostic ceiling KiB:',cap,'optimizer KiB:',opt)\nPY\n"},{name: Install genuine matching SDK development inputs without unscoped compiler probes,run: "set -euo pipefail\nversion=$(python3 -c 'import json; print(json.load(open(\"docs/architecture/amdgpu-toolchain.json\"))[\"profiles\"][\"linux-x86_64\"][\"package_version\"])')\nsudo -n apt-get update\nsudo -n apt-get install --yes --no-install-recommends bubblewrap ripgrep strace cmake ninja-build patch gnupg \\\n  \"llvm-20=$version\" \"llvm-20-dev=$version\" \"clang-20=$version\" \"lld-20=$version\" \\\n  \"libllvm20=$version\" \"libclang-rt-20-dev=$version\"\nllvm_root=\"$RUNNER_TEMP/seen-diagnostic-llvm20/bin\"\nmkdir -p \"$llvm_root\"\nfor tool in clang clang++ opt llvm-as llvm-link llc llvm-profdata llvm-cov llvm-nm llvm-ar llvm-dis llvm-objdump ld.lld lld wasm-ld; do\n  test -x \"/usr/bin/$tool-20\"\n  ln -s \"/usr/bin/$tool-20\" \"$llvm_root/$tool\"\ndone\nprintf '%s\\n' \"$llvm_root\" >> \"$GITHUB_PATH\"\nprofile=\"$RUNNER_TEMP/seen-diagnostic-bwrap\"\nprintf '%s\\n' 'abi <abi/4.0>,' 'include <tunables/global>' \\\n  '/usr/bin/bwrap flags=(default_allow) {' '  userns,' '}' > \"$profile\"\nsudo -n /usr/sbin/apparmor_parser --replace \"$profile\"\n"},{name: Read exact immutable SDK experiment inputs,env: {GH_TOKEN: "${{ github.token }}"},run: "set -euo pipefail\ninputs=\"$PWD/.seen/hardware-checks/tsan-finite-inputs\"\nmkdir -p \"$inputs\"\ngh api -H \"Accept: application/vnd.github.raw+json\" \"repos/codeyousef/SeenLang/contents/.github/diagnostics/tsan-finite-probe.sh?ref=$GITHUB_SHA\" > \"$inputs/tsan-finite-probe.sh\"\nprintf '%s  %s\\n' 8c1cb6eb942656a7df6b2654d4472097f174e84902d92257e72a8a58b9c97c56 \"$inputs/tsan-finite-probe.sh\" | sha256sum --check\ngh api -H \"Accept: application/vnd.github.raw+json\" \"repos/codeyousef/SeenLang/contents/.github/diagnostics/tsan-finite-as.patch?ref=$GITHUB_SHA\" > \"$inputs/tsan-finite-as.patch\"\nprintf '%s  %s\\n' 56e2a9e03d2e2cbb7902af0504b33fdee3b40c4256c1be7777c62eba439bc23f \"$inputs/tsan-finite-as.patch\" | sha256sum --check\ngh api -H \"Accept: application/vnd.github.raw+json\" \"repos/codeyousef/SeenLang/contents/.github/diagnostics/tsan-finite-control.c?ref=$GITHUB_SHA\" > \"$inputs/tsan-finite-control.c\"\nprintf '%s  %s\\n' 6e71eb63d7166e54abf74733d478c45b03698b34ec5b1241f1a8f2c0ac0950cc \"$inputs/tsan-finite-control.c\" | sha256sum --check\n"},{name: Build genuine SDK and observe strict finite-address controls,run: "bash .seen/hardware-checks/tsan-finite-inputs/tsan-finite-probe.sh \"$PWD/.seen/hardware-checks/tsan-finite-inputs\"\n"},{name: Retain bounded SDK observations only,if: always(),uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a,with: {name: "tsan-finite-sdk-observations-${{ github.run_id }}",path: .seen/hardware-checks/tsan-finite-proof.*/,include-hidden-files: true,if-no-files-found: warn,retention-days: 1}}]}}}